<!DOCTYPE html>
<html lang="en">
<head>
    <title id="titleWeb">Gửi em</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        /* ===== ORIGINAL mystyle.css ===== */
        * { margin: 0; padding: 0; }
        html, body { margin: 0; height: 100%; overflow: hidden; }
        body { background-size: 100%; -webkit-perspective: 800; }
        li { list-style: none; }

        .box {
            width: 200px; height: 200px;
            position: relative;
            margin: 300px auto;
            transform-style: preserve-3d;
            transform: rotateX(13deg);
            animation: move 5s linear infinite;
        }
        .minbox {
            width: 100px; height: 100px;
            position: absolute; left: 50px; top: 50px;
            transform-style: preserve-3d;
        }
        .minbox li { width: 100px; height: 100px; position: absolute; left: 0; top: 0; }
        .minbox li:nth-child(1) { transform: translateZ(50px); background-size: cover; }
        .minbox li:nth-child(2) { transform: rotateX(180deg) translateZ(50px); background-size: cover; }
        .minbox li:nth-child(3) { transform: rotateX(-90deg) translateZ(50px); background-size: cover; }
        .minbox li:nth-child(4) { transform: rotateX(90deg) translateZ(50px); background-size: cover; }
        .minbox li:nth-child(5) { transform: rotateY(-90deg) translateZ(50px); background-size: cover; }
        .minbox li:nth-child(6) { transform: rotateY(90deg) translateZ(50px); background-size: cover; }

        .maxbox {
            width: 200px; height: 200px;
            position: absolute; left: 0; top: 0;
            transform-style: preserve-3d;
        }
        .maxbox li {
            width: 200px; height: 200px;
            background: #fff; border: 1px solid #ccc;
            position: absolute; left: 0; top: 0;
            opacity: 0.2; transition: all 1s ease;
        }
        .maxbox li:nth-child(1) { transform: translateZ(100px); background-size: 100% 100%; }
        .maxbox li:nth-child(2) { transform: rotateX(180deg) translateZ(100px); background-size: 100% 100%; }
        .maxbox li:nth-child(3) { transform: rotateX(-90deg) translateZ(100px); background-size: 100% 100%; }
        .maxbox li:nth-child(4) { transform: rotateX(90deg) translateZ(100px); background-size: 100% 100%; }
        .maxbox li:nth-child(5) { transform: rotateY(-90deg) translateZ(100px); background-size: 100% 100%; }
        .maxbox li:nth-child(6) { transform: rotateY(90deg) translateZ(100px); background-size: 100% 100%; }

        .box:hover ol li:nth-child(1) { transform: translateZ(300px); width: 400px; height: 400px; opacity: 0.8; left: -100px; top: -100px; }
        .box:hover ol li:nth-child(2) { transform: rotateX(180deg) translateZ(300px); width: 400px; height: 400px; opacity: 0.8; left: -100px; top: -100px; }
        .box:hover ol li:nth-child(3) { transform: rotateX(-90deg) translateZ(300px); width: 400px; height: 400px; opacity: 0.8; left: -100px; top: -100px; }
        .box:hover ol li:nth-child(4) { transform: rotateX(90deg) translateZ(300px); width: 400px; height: 400px; opacity: 0.8; left: -100px; top: -100px; }
        .box:hover ol li:nth-child(5) { transform: rotateY(-90deg) translateZ(300px); width: 400px; height: 400px; opacity: 0.8; left: -100px; top: -100px; }
        .box:hover ol li:nth-child(6) { transform: rotateY(90deg) translateZ(300px); width: 400px; height: 400px; opacity: 0.8; left: -100px; top: -100px; }

        @keyframes move {
            0%   { transform: rotateX(13deg) rotateY(0deg); }
            25%  { transform: rotateX(26deg) rotateY(90deg); }
            50%  { transform: rotateX(50deg) rotateY(180deg); }
            75%  { transform: rotateX(26deg) rotateY(270deg); }
            100% { transform: rotateX(13deg) rotateY(360deg); }
        }

        /* ===== UPLOAD PANEL ===== */
        #upload-panel {
            position: fixed; inset: 0;
            background: rgba(182, 216, 255, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-card {
            background: white;
            border-radius: 20px;
            padding: 28px 30px;
            width: min(560px, 94vw);
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 16px 48px rgba(90, 130, 190, 0.2);
            font-family: 'Segoe UI', sans-serif;
        }

        .panel-card h2 {
            text-align: center; color: #2e6ea8;
            font-size: 1.4rem; margin-bottom: 2px;
        }

        .panel-card .sub {
            text-align: center; color: #557aa8;
            font-size: 0.8rem; margin-bottom: 20px;
        }

        .field-row {
            display: flex; align-items: center;
            gap: 10px; margin-bottom: 14px;
        }

        .field-row label {
            font-size: 0.82rem; color: #2e6ea8;
            font-weight: 700; min-width: 80px;
        }

        .field-row input[type="text"] {
            flex: 1; padding: 8px 12px;
            border: 1.5px solid #c6ddff; border-radius: 10px;
            font-size: 0.9rem; color: #2f4f73; outline: none;
        }

        .sec-title {
            font-size: 0.78rem; font-weight: 700;
            color: #2e6ea8; letter-spacing: 0.4px;
            margin: 14px 0 8px;
            display: flex; align-items: center; gap: 6px;
        }

        .sec-title::after {
            content: ''; flex: 1;
            height: 1px; background: #cfe3ff;
        }

        /* 6-col grid */
        .img-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .img-slot {
            position: relative; aspect-ratio: 1;
            border: 2px dashed #c6ddff; border-radius: 10px;
            overflow: hidden; cursor: pointer;
            background: #f3f9ff; transition: border-color 0.2s;
        }

        .img-slot:hover { border-color: #6ca6e8; }
        .img-slot.filled { border-style: solid; border-color: #6ca6e8; }

        .img-slot input[type="file"] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }

        .img-slot img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; display: none;
        }

        .img-slot.filled img { display: block; }
        .img-slot.filled .plus { display: none; }

        .img-slot .plus {
            position: absolute; inset: 0;
            display: flex; align-items: center;
            justify-content: center;
            color: #bfd9ff; font-size: 1.3rem;
            pointer-events: none;
        }

        .img-slot .num {
            position: absolute; top: 2px; left: 4px;
            font-size: 0.55rem; color: #467ec9;
            font-weight: 700; z-index: 2;
            pointer-events: none;
        }

        /* Background slot */
        .bg-slot {
            position: relative; width: 100%; height: 58px;
            border: 2px dashed #c6ddff; border-radius: 10px;
            overflow: hidden; cursor: pointer;
            background: #f3f9ff;
            display: flex; align-items: center;
            justify-content: center; gap: 10px;
            transition: border-color 0.2s;
        }

        .bg-slot:hover { border-color: #6ca6e8; }
        .bg-slot.filled { border-style: solid; border-color: #6ca6e8; }
        .bg-slot input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .bg-slot img {
            width: 42px; height: 42px;
            object-fit: cover; border-radius: 6px; display: none;
        }

        .bg-slot.filled img { display: block; }
        .bg-slot.filled .bg-hint { display: none; }

        .bg-hint { font-size: 0.82rem; color: #5d87bf; pointer-events: none; }

        .bg-name {
            font-size: 0.8rem; color: #2f4f73;
            max-width: 160px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }

        .prog { text-align: center; font-size: 0.78rem; color: #5d87bf; margin: 12px 0 6px; }

        .btn-apply {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #7cb5ff, #3e7ad5);
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 16px rgba(62, 122, 213, 0.3);
        }

        .btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-apply:not(:disabled):hover { transform: translateY(-2px); }

        /* Edit button */
        #btn-edit {
            position: fixed; bottom: 18px; right: 18px;
            z-index: 200; background: rgba(255,255,255,0.85);
            color: #2d6fb4; border: 1.5px solid #cfe3ff;
            border-radius: 40px; padding: 8px 18px;
            font-size: 0.82rem; font-weight: 700;
            cursor: pointer; display: none;
            box-shadow: 0 2px 12px rgba(90, 130, 190, 0.2);
            font-family: 'Segoe UI', sans-serif;
            transition: transform 0.2s;
        }

        #btn-edit:hover { transform: scale(1.05); }

        /* ===== LOGIN SCREEN ===== */
        #login-screen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #dfeeff, #c2d9ff, #9ec7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            width: min(400px, 90vw);
            box-shadow: 0 16px 48px rgba(83, 124, 194, 0.3);
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card h2 {
            color: #2b6eb3;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #3f75b5;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .login-input {
            width: 80%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #cfe3ff;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .login-input:focus {
            border-color: #6ca6e8;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7aaee8, #3d77d9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error-msg {
            color: #245dba;
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body style="width:100%; height:100%;">

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
    <div class="login-card">
        <h2>Đăng Nhập</h2>
        <p>Nhập tài khoản để tiếp tục</p>
        <input type="text" id="username" class="login-input" placeholder="Tài khoản">
        <input type="password" id="password" class="login-input" placeholder="Mật khẩu">
        <button class="login-btn" onclick="login()">Đăng Nhập</button>
        <div id="error-msg" class="error-msg">Tài khoản hoặc mật khẩu không đúng!</div>
    </div>
</div>

<!-- ===== UPLOAD PANEL ===== -->
<div id="upload-panel" style="display:none;">
    <div class="panel-card">
        <h2>THANH TRUC SO CUTE!</h2>
        <p class="sub">Upload ảnh từ máy tính hoặc điện thoại của em nhé!</p>

        <div class="field-row">
            <label>📝 Tiêu đề</label>
            <input type="text" id="inp-title" value="Gửi Thanh Truc!" placeholder="Nhập tiêu đề...">
        </div>

        <div class="sec-title">Ảnh nền trang web</div>
        <div class="bg-slot" id="bg-slot">
            <input type="file" accept="image/*" onchange="uploadBg(this)">
            <span class="bg-hint">Nhấn để chọn ảnh nền</span>
            <img id="bg-thumb" src="" alt="">
            <span id="bg-name" class="bg-name"></span>
        </div>

        <div class="sec-title">6 ảnh mặt hộp nhỏ (bên trong)</div>
        <div class="img-grid" id="min-grid"></div>

        <div class="sec-title">6 ảnh mặt hộp lớn (khi hover)</div>
        <div class="img-grid" id="max-grid"></div>

        <p class="prog" id="prog-text">Em nhớ upload đủ 13 ảnh nha</p>
        <button class="btn-apply" id="btn-apply" onclick="applyAndShow()" disabled>
            BẤM VÀO ĐÂY ĐỂ HIỂN THỊ HỘP NHA!
        </button>
    </div>
</div>

<!-- ===== ORIGINAL BOX LAYOUT ===== -->
<div class="box" id="main-box" style="display:none;">
    <ul class="minbox">
        <li id="min1"></li>
        <li id="min2"></li>
        <li id="min3"></li>
        <li id="min4"></li>
        <li id="min5"></li>
        <li id="min6"></li>
    </ul>
    <ol class="maxbox">
        <li id="max1"></li>
        <li id="max2"></li>
        <li id="max3"></li>
        <li id="max4"></li>
        <li id="max5"></li>
        <li id="max6"></li>
    </ol>
</div>

<audio id="player" loop>
    <source src="music.mp3" type="audio/mp4">
</audio>

<button id="btn-edit" onclick="openPanel()">✏️ Đổi ảnh</button>

<script>
    // ---- Image state ----
    const imgs = { bg: null, min: Array(6).fill(null), max: Array(6).fill(null) };

    // ---- Build upload grids ----
    function buildGrids() {
        const mg = document.getElementById('min-grid');
        const xg = document.getElementById('max-grid');
        for (let i = 0; i < 6; i++) {
            mg.innerHTML += slot('min', i);
            xg.innerHTML += slot('max', i);
        }
    }

    function slot(t, i) {
        return `<div class="img-slot" id="${t}-slot-${i}">
            <span class="num">${i+1}</span>
            <input type="file" accept="image/*" onchange="uploadImg(this,'${t}',${i})">
            <img id="${t}-prev-${i}" src="" alt="">
            <div class="plus">＋</div>
        </div>`;
    }

    // ---- Readers ----
    function readFile(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => res(e.target.result);
            r.readAsDataURL(file);
        });
    }

    async function uploadBg(input) {
        if (!input.files[0]) return;
        imgs.bg = await readFile(input.files[0]);
        document.getElementById('bg-slot').classList.add('filled');
        document.getElementById('bg-thumb').src = imgs.bg;
        document.getElementById('bg-name').textContent = input.files[0].name;
        checkProgress();
    }

    async function uploadImg(input, type, i) {
        if (!input.files[0]) return;
        imgs[type][i] = await readFile(input.files[0]);
        document.getElementById(`${type}-slot-${i}`).classList.add('filled');
        document.getElementById(`${type}-prev-${i}`).src = imgs[type][i];
        checkProgress();
    }

    function checkProgress() {
        const done = (imgs.bg ? 1 : 0)
            + imgs.min.filter(Boolean).length
            + imgs.max.filter(Boolean).length;
        const prog = document.getElementById('prog-text');
        const btn  = document.getElementById('btn-apply');
        prog.textContent = done >= 13
            ? 'Mong em ngày nào cũng vui vẻ nha!'
            : `Đã upload ${done}/13 ảnh ✦`;
        btn.disabled = done < 13;
    }

    // ---- Apply: replicate original main.js logic ----
    function applyAndShow() {
        const title = document.getElementById('inp-title').value || 'Gửi Thanh Truc!';
        document.getElementById('titleWeb').textContent = title;

        // Background (original: $('body').css('background-image', 'url(./images/' + CONFIG.background + ')'))
        $('body').css('background-image', `url(${imgs.bg})`);

        // Min faces (original: for loop setting background-image)
        for (let i = 1; i <= 6; i++)
            $(`#min${i}`).css('background-image', `url(${imgs.min[i-1]})`);

        // Max faces
        for (let i = 1; i <= 6; i++)
            $(`#max${i}`).css('background-image', `url(${imgs.max[i-1]})`);

        // Show box
        document.getElementById('upload-panel').style.display = 'none';
        document.getElementById('main-box').style.display   = 'block';
        document.getElementById('btn-edit').style.display   = 'block';

        // Play audio with iOS compatibility
        const player = document.getElementById('player');
        player.muted = false;
        const playPromise = player.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log('Autoplay bị chặn trên iPhone, người dùng cần tap để phát nhạc');
                // Khi người dùng tap/click bất kỳ nơi nào trên trang, sẽ phát nhạc
                document.addEventListener('touchstart', () => {
                    player.play().catch(e => console.log('Lỗi phát nhạc:', e));
                }, { once: true });
            });
        }
    }

    function openPanel() {
        document.getElementById('upload-panel').style.display = 'flex';
        document.getElementById('main-box').style.display   = 'none';
        document.getElementById('btn-edit').style.display   = 'none';
    }

    // ---- Login function ----
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (username === 'thanhtruc' && password === '1') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('upload-panel').style.display = 'flex';
            errorMsg.style.display = 'none';
        } else {
            errorMsg.style.display = 'block';
        }
    }

    buildGrids();
</script>
</body>
</html>
